<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bezier Curve Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            max-width: 300px;
        }
        
        #instructions h3 {
            margin-top: 0;
            color: #333;
        }
        
        #instructions ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        #instructions li {
            margin: 5px 0;
            color: #555;
            font-size: 14px;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        button {
            padding: 8px 15px;
            margin: 5px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        button.delete {
            background: #f44336;
        }
        
        button.delete:hover {
            background: #da190b;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h3>Bezier Curve Editor</h3>
        <ul>
            <li><strong>Click</strong> on empty space to add a point</li>
            <li><strong>Drag</strong> points to move them</li>
            <li><strong>Drag handles</strong> to adjust curves</li>
            <li><strong>Click on curve</strong> to add a point on it</li>
            <li><strong>Shift+Click</strong> on point to select/deselect</li>
            <li><strong>Delete key</strong> to delete selected points</li>
            <li><strong>Drag selected</strong> to move multiple points</li>
        </ul>
    </div>
    
    <div id="controls">
        <button onclick="clearAll()">Clear All</button>
        <button class="delete" onclick="deleteSelected()">Delete Selected</button>
    </div>
    
    <script>
        let points = [];
        let selectedPoints = new Set();
        let draggingPoint = null;
        let draggingHandle = null;
        let draggingSelected = false;
        let dragOffset = { x: 0, y: 0 };
        let lastMousePos = { x: 0, y: 0 };
        
        class BezierPoint {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.handleIn = { x: x - 50, y: y };
                this.handleOut = { x: x + 50, y: y };
                this.selected = false;
            }
            
            draw() {
                // Draw handles
                stroke(150);
                strokeWeight(1);
                line(this.handleIn.x, this.handleIn.y, this.x, this.y);
                line(this.x, this.y, this.handleOut.x, this.handleOut.y);
                
                // Draw handle points
                fill(100, 150, 255);
                noStroke();
                ellipse(this.handleIn.x, this.handleIn.y, 8, 8);
                ellipse(this.handleOut.x, this.handleOut.y, 8, 8);
                
                // Draw main point
                if (this.selected) {
                    fill(255, 100, 100);
                    ellipse(this.x, this.y, 16, 16);
                } else {
                    fill(50, 50, 50);
                    ellipse(this.x, this.y, 12, 12);
                }
            }
            
            isNearPoint(mx, my, threshold = 10) {
                return dist(mx, my, this.x, this.y) < threshold;
            }
            
            isNearHandleIn(mx, my, threshold = 8) {
                return dist(mx, my, this.handleIn.x, this.handleIn.y) < threshold;
            }
            
            isNearHandleOut(mx, my, threshold = 8) {
                return dist(mx, my, this.handleOut.x, this.handleOut.y) < threshold;
            }
            
            moveBy(dx, dy) {
                this.x += dx;
                this.y += dy;
                this.handleIn.x += dx;
                this.handleIn.y += dy;
                this.handleOut.x += dx;
                this.handleOut.y += dy;
            }
        }
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
        }
        
        function draw() {
            background(240);
            
            // Draw Bezier curves between consecutive points
            if (points.length >= 2) {
                noFill();
                stroke(50, 50, 50);
                strokeWeight(2);
                
                for (let i = 0; i < points.length - 1; i++) {
                    let p1 = points[i];
                    let p2 = points[i + 1];
                    bezier(
                        p1.x, p1.y,
                        p1.handleOut.x, p1.handleOut.y,
                        p2.handleIn.x, p2.handleIn.y,
                        p2.x, p2.y
                    );
                }
            }
            
            // Draw all points and their handles
            for (let point of points) {
                point.draw();
            }
        }
        
        function mousePressed() {
            let mx = mouseX;
            let my = mouseY;
            
            // Check if clicking on UI elements
            if (isOverUI(mx, my)) return;
            
            // Check for handle dragging first
            for (let point of points) {
                if (point.isNearHandleIn(mx, my)) {
                    draggingHandle = { point: point, handle: 'in' };
                    return;
                }
                if (point.isNearHandleOut(mx, my)) {
                    draggingHandle = { point: point, handle: 'out' };
                    return;
                }
            }
            
            // Check for point selection/dragging
            for (let point of points) {
                if (point.isNearPoint(mx, my)) {
                    if (keyIsDown(SHIFT)) {
                        // Toggle selection with Shift+Click
                        point.selected = !point.selected;
                        if (point.selected) {
                            selectedPoints.add(point);
                        } else {
                            selectedPoints.delete(point);
                        }
                    } else {
                        // Start dragging
                        if (point.selected && selectedPoints.size > 1) {
                            // Drag all selected points
                            draggingSelected = true;
                            lastMousePos = { x: mx, y: my };
                        } else {
                            // Drag single point
                            draggingPoint = point;
                            dragOffset = { x: mx - point.x, y: my - point.y };
                        }
                    }
                    return;
                }
            }
            
            // Check if clicking on a curve to add a point
            if (points.length >= 2) {
                for (let i = 0; i < points.length - 1; i++) {
                    if (isNearCurve(mx, my, points[i], points[i + 1])) {
                        // Add a new point on the curve
                        let t = findClosestT(mx, my, points[i], points[i + 1]);
                        let newPoint = createPointOnCurve(points[i], points[i + 1], t);
                        points.splice(i + 1, 0, newPoint);
                        return;
                    }
                }
            }
            
            // Add new point at click location
            let newPoint = new BezierPoint(mx, my);
            points.push(newPoint);
        }
        
        function mouseDragged() {
            let mx = mouseX;
            let my = mouseY;
            
            if (draggingHandle) {
                let point = draggingHandle.point;
                if (draggingHandle.handle === 'in') {
                    // Move the in handle
                    draggingHandle.point.handleIn.x = mx;
                    draggingHandle.point.handleIn.y = my;
                    
                    // Balance the out handle (mirror position relative to point)
                    let dx = point.x - mx;
                    let dy = point.y - my;
                    point.handleOut.x = point.x + dx;
                    point.handleOut.y = point.y + dy;
                } else {
                    // Move the out handle
                    draggingHandle.point.handleOut.x = mx;
                    draggingHandle.point.handleOut.y = my;
                    
                    // Balance the in handle (mirror position relative to point)
                    let dx = point.x - mx;
                    let dy = point.y - my;
                    point.handleIn.x = point.x + dx;
                    point.handleIn.y = point.y + dy;
                }
            } else if (draggingPoint) {
                // Calculate the movement delta
                let newX = mx - dragOffset.x;
                let newY = my - dragOffset.y;
                let dx = newX - draggingPoint.x;
                let dy = newY - draggingPoint.y;
                
                // Move the point
                draggingPoint.x = newX;
                draggingPoint.y = newY;
                
                // Move handles with the point (maintain relative positions)
                draggingPoint.handleIn.x += dx;
                draggingPoint.handleIn.y += dy;
                draggingPoint.handleOut.x += dx;
                draggingPoint.handleOut.y += dy;
            } else if (draggingSelected) {
                let dx = mx - lastMousePos.x;
                let dy = my - lastMousePos.y;
                
                for (let point of selectedPoints) {
                    point.moveBy(dx, dy);
                }
                
                lastMousePos = { x: mx, y: my };
            }
        }
        
        function mouseReleased() {
            draggingPoint = null;
            draggingHandle = null;
            draggingSelected = false;
        }
        
        function keyPressed() {
            if (key === 'Delete' || keyCode === DELETE) {
                deleteSelected();
            }
        }
        
        function isNearCurve(mx, my, p1, p2, threshold = 10) {
            // Sample points along the curve and check distance
            for (let t = 0; t <= 1; t += 0.01) {
                let x = bezierPoint(p1.x, p1.handleOut.x, p2.handleIn.x, p2.x, t);
                let y = bezierPoint(p1.y, p1.handleOut.y, p2.handleIn.y, p2.y, t);
                if (dist(mx, my, x, y) < threshold) {
                    return true;
                }
            }
            return false;
        }
        
        function findClosestT(mx, my, p1, p2) {
            let minDist = Infinity;
            let bestT = 0.5;
            
            for (let t = 0; t <= 1; t += 0.01) {
                let x = bezierPoint(p1.x, p1.handleOut.x, p2.handleIn.x, p2.x, t);
                let y = bezierPoint(p1.y, p1.handleOut.y, p2.handleIn.y, p2.y, t);
                let d = dist(mx, my, x, y);
                if (d < minDist) {
                    minDist = d;
                    bestT = t;
                }
            }
            
            return bestT;
        }
        
        function createPointOnCurve(p1, p2, t) {
            let x = bezierPoint(p1.x, p1.handleOut.x, p2.handleIn.x, p2.x, t);
            let y = bezierPoint(p1.y, p1.handleOut.y, p2.handleIn.y, p2.y, t);
            
            // Calculate tangent for handle positions
            let tx = bezierTangent(p1.x, p1.handleOut.x, p2.handleIn.x, p2.x, t);
            let ty = bezierTangent(p1.y, p1.handleOut.y, p2.handleIn.y, p2.y, t);
            
            let newPoint = new BezierPoint(x, y);
            
            // Set handles along the tangent
            let handleLength = 50;
            let angle = atan2(ty, tx);
            newPoint.handleIn.x = x - cos(angle) * handleLength;
            newPoint.handleIn.y = y - sin(angle) * handleLength;
            newPoint.handleOut.x = x + cos(angle) * handleLength;
            newPoint.handleOut.y = y + sin(angle) * handleLength;
            
            return newPoint;
        }
        
        function isOverUI(mx, my) {
            // Check if mouse is over UI elements
            let instructions = document.getElementById('instructions');
            let controls = document.getElementById('controls');
            
            let instructionsRect = instructions.getBoundingClientRect();
            let controlsRect = controls.getBoundingClientRect();
            
            return (mx >= instructionsRect.left && mx <= instructionsRect.right &&
                    my >= instructionsRect.top && my <= instructionsRect.bottom) ||
                   (mx >= controlsRect.left && mx <= controlsRect.right &&
                    my >= controlsRect.top && my <= controlsRect.bottom);
        }
        
        function clearAll() {
            points = [];
            selectedPoints.clear();
        }
        
        function deleteSelected() {
            if (selectedPoints.size > 0) {
                points = points.filter(p => !selectedPoints.has(p));
                selectedPoints.clear();
            } else {
                // If no points selected, delete all selected points
                points = points.filter(p => !p.selected);
            }
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
